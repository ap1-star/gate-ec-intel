name: One-time import GATE EC source
on:
  push:
    paths:
      - .github/workflows/import-gate-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Safely extract the uploaded project source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          zip_path = Path("GATE_EC_GITHUB_UPLOAD_KIT.zip")
          assert zip_path.is_file(), "Expected uploaded ZIP is missing"
          root = Path.cwd().resolve()
          prefix = "gate-ec-intel/"
          written = 0
          with ZipFile(zip_path) as archive:
              files = [i for i in archive.infolist() if i.filename.startswith(prefix) and not i.is_dir()]
              assert len(files) >= 100, f"Unexpected source file count: {len(files)}"
              for entry in files:
                  rel = entry.filename[len(prefix):]
                  segments = PurePosixPath(rel).parts
                  assert rel and all(p not in ("", ".", "..") for p in segments), f"Unsafe path: {rel}"
                  assert not stat.S_ISLNK(entry.external_attr >> 16), f"Symlink not allowed: {rel}"
                  assert not (segments[0] == ".git"), f"Git internal path: {rel}"
                  assert not (segments[0] == ".github"), f"Untrusted workflow path: {rel}"
                  target = (root / Path(*segments)).resolve()
                  assert target.is_relative_to(root), f"Path escapes repo: {rel}"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(entry))
                  written += 1
          assert Path("package.json").exists(), "Missing package.json after extraction"
          assert Path("Dockerfile").exists(), "Missing Dockerfile after extraction"
          assert Path("railway.toml").exists(), "Missing railway.toml after extraction"
          print(f"Extracted {written} source files at repository root")
          zip_path.unlink()
          Path(".github/workflows/import-gate-source.yml").unlink()
          PY
      - name: Commit extracted files and remove ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import GATE EC hosting source from uploaded archive"
          git push origin HEAD:main
